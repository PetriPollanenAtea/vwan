virtual_networks:

  emea_application:
    name: vnet-emea-application-001
    resource_group_name: rg-vnets
    location: swedencentral
    address_space:
      - 172.16.0.0/22
    dns_servers:
      - 172.16.0.4
      - 172.16.0.5
    tags:
      environment: production
      region: emea
      managed_by: terraform
    subnets:
      application:
        name: snet-application
        address_prefixes:
          - 172.16.0.0/24
      database:
        name: snet-database
        address_prefixes:
          - 172.16.1.0/24
      private_endpoints:
        name: snet-private-endpoints
        address_prefixes:
          - 172.16.2.0/24
        private_endpoint_network_policies: Disabled

  emea_shared_services:
    name: vnet-emea-shared-services-001
    resource_group_name: rg-vnets
    location: swedencentral
    address_space:
      - 172.16.4.0/22
    tags:
      environment: production
      region: emea
      managed_by: terraform
    subnets:
      shared_services:
        name: snet-shared-services
        address_prefixes:
          - 172.16.4.0/24

  americas_application:
    name: vnet-americas-application-001
    resource_group_name: rg-vnets
    location: westeurope
    address_space:
      - 172.16.8.0/22
    tags:
      environment: production
      region: americas
      managed_by: terraform
    subnets:
      application:
        name: snet-application
        address_prefixes:
          - 172.16.9.0/24
      database:
        name: snet-database
        address_prefixes:
          - 172.16.10.0/24