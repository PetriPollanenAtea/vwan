name: network-branch-sites
priority: 300
action: Allow
rules:
  - name: allow-emea-sites-to-shared-services
    description: Allow EMEA branch sites access to shared infrastructure
    protocols:
      - TCP
      - UDP
    source_ip_groups:
      - emea/branch-sites
    destination_ip_groups:
      - global/shared-services
    destination_ports:
      - "53"
      - "88"
      - "123"
      - "135"
      - "389"
      - "445"
      - "636"
      - "3268"
      - "3269"
  - name: allow-emea-sites-to-domain-controllers
    description: Allow Active Directory communication
    protocols:
      - TCP
      - UDP
    source_ip_groups:
      - emea/branch-sites
    destination_ip_groups:
      - global/domain-controllers
    destination_ports:
      - "53"
      - "88"
      - "123"
      - "135"
      - "389"
      - "445"
      - "464"
      - "636"
  - name: allow-emea-sites-to-private-dns
    description: Allow DNS forwarding to central DNS services
    protocols:
      - TCP
      - UDP
    source_ip_groups:
      - emea/branch-sites
    destination_ip_groups:
      - global/shared-services
    destination_ports:
      - "53"