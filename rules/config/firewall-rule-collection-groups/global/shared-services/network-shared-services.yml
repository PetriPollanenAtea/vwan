name: network-shared-services
priority: 100
action: Allow
rules:
  - name: allow-adds
    description: Domain controller access
    protocols:
      - TCP
      - UDP
    source_ip_groups:
      - global/shared-services
    destination_ip_groups:
      - global/domain-controllers
    destination_ports:
      - "53"
      - "88"
      - "135"
      - "389"
      - "445"