name: network-branch-sites
priority: 200
action: Allow
rules:
  - name: allow-americas-sites-to-shared-services
    description: Allow Americas branch sites to access shared infrastructure
    protocols:
      - TCP
      - UDP
    source_ip_groups:
      - americas/branch-sites
    destination_ip_groups:
      - global/shared-services
    destination_ports:
      - "53"
      - "88"
      - "123"
      - "135"
      - "389"
      - "445"
      - "636"
      - "3268"
      - "3269"
  - name: allow-americas-sites-to-domain-controllers
    description: Allow Active Directory communication
    protocols:
      - TCP
      - UDP
    source_ip_groups:
      - americas/branch-sites
    destination_ip_groups:
      - global/domain-controllers
    destination_ports:
      - "53"
      - "88"
      - "123"
      - "135"
      - "389"
      - "445"
      - "464"
      - "636"
