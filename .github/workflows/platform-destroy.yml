name: Platform - Destroy

on:
  workflow_dispatch:
    inputs:

      operation:
        description: "Terraform operation"
        required: true
        type: choice
        default: destroy

        options:
          - destroy

permissions:
  contents: read
  id-token: write

concurrency:
  group: platform-production
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

  TF_WORKING_DIR: "./platform"

  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"

  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:

  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}
          terraform_wrapper: false


      - name: Terraform Format
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform fmt \
            -check \
            -recursive \
            -diff


      - name: Terraform Init - no backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend=false \
            -input=false


      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform validate \
            -no-color


  destroy:
    name: Destroy

    if: ${{ inputs.operation == 'destroy' }}

    needs:
      - validate

    runs-on: ubuntu-latest

    environment: platform-production

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}
          terraform_wrapper: false


      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -reconfigure \
            -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=${{ vars.TFSTATE_PLATFORM_KEY }}" \
            -backend-config="use_azuread_auth=true"


      - name: Terraform Destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform destroy \
            -input=false \
            -lock-timeout=10m \
            -auto-approve \